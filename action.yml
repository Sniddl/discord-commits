name: Discord Commits
description: Send commit summary to Discord using custom templates
branding:
  icon: bell
  color: purple
inputs:
  webhook:
    description: discord webhook url without /github
    required: true
  message:
    description: "A general message that is displayed for all commits. Defaults to the repo name."
  embed:
    description: "JSON string that accepts double braces for templates. Defaults to template's embed template"
  include-extras:
    description: "Boolean - Include extra embeds provided from templates."
  template:
    description: "The name of of a premade template."
  last-commit-only:
    description: "Boolean - only show the last commit."
  include-commits:
    description: "Multiline regex patterns - only include commits matching these patterns."
  exclude-commits:
    description: "Multiline regex patterns - exclude commits matching these patterns."
  include-footer:
    description: "Boolean - Include footer content in descriptions."
  note-keywords:
    description: "Multiline list of footer identifiers (e.g., Signed-off-by, Co-authored-by)."

runs:
  using: node16
  main: dist/index.js
